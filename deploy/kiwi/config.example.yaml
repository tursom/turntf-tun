# Copy to /opt/turntf/tun/config.yaml on kiwi, then replace every REPLACE_* value.
turntf:
  base_url: "https://kiwintf.tursom.dev"
  request_timeout: "10s"
  ping_interval: "30s"
  credentials:
    login_name: "turntf-tun-kiwi"
    password:
      source: "plain"
      value: "REPLACE_WITH_KIWI_TUN_PASSWORD"

tun:
  name: "turntf0"
  mtu: 1400
  addresses:
    - "10.250.0.3/24"
  bring_up: true

transport:
  send_queue_size: 4096
  max_packet_bytes: 65535
  dial_retry_interval: "3s"

peers:
  - name: "kr"
    user:
      node_id: 54064871525449607 # turntf-tun-kr node_id
      user_id: 1032 # turntf-tun-kr user_id
    routes:
      - "10.250.0.1/32"
    dial_policy: "auto"
  - name: "cc"
    user:
      node_id: 54064871525449607 # turntf-tun-cc node_id
      user_id: 1033 # turntf-tun-cc user_id
    routes:
      - "10.250.0.2/32"
    dial_policy: "auto"
