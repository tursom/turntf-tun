# Copy to /opt/turntf/tun/config.yaml on pangolin, then replace every REPLACE_* value.
turntf:
  base_url: "https://turntf.home.tursom.cn:20080"
  request_timeout: "10s"
  ping_interval: "30s"
  credentials:
    login_name: "turntf-tun-pangolin-vlan"
    password:
      source: "hashed"
      value: "REPLACE_WITH_PANGOLIN_TUN_PASSWORD"

tun:
  name: "turntf0"
  mtu: 1400
  addresses:
    - "10.250.0.5/32"
  bring_up: true

transport:
  mode: "auto"
  send_queue_size: 4096
  max_packet_bytes: 65535
  dial_retry_interval: "3s"

peers:
  - name: "kr"
    user:
      node_id: 54064871525449607
      user_id: 1032
    routes:
      - "10.250.0.1/32"
    dial_policy: "auto"
  - name: "cc"
    user:
      node_id: 54064871525449607
      user_id: 1033
    routes:
      - "10.250.0.2/32"
    dial_policy: "auto"
  - name: "kiwi"
    user:
      node_id: 54064871525449607
      user_id: 1034
    routes:
      - "10.250.0.3/32"
    dial_policy: "auto"
  - name: "router"
    user:
      node_id: 54064626334500285
      user_id: 1061
    routes:
      - "10.250.0.4/32"
    dial_policy: "auto"
