# Copy to /opt/turntf/tun/config.yaml on kr, then replace every REPLACE_* value.
turntf:
  base_url: "https://krntf.tursom.dev"
  request_timeout: "10s"
  ping_interval: "30s"
  credentials:
    login_name: "turntf-tun-kr"
    password:
      source: "hashed"
      value: "REPLACE_WITH_KR_TUN_PASSWORD"

tun:
  name: "turntf0"
  mtu: 1400
  addresses:
    - "10.250.0.1/32"
  bring_up: true

transport:
  mode: "auto"
  send_queue_size: 4096
  max_packet_bytes: 65535
  dial_retry_interval: "3s"

peers:
  - name: "cc"
    user:
      node_id: 54064871525449607 # turntf-tun-cc node_id
      user_id: 1033 # turntf-tun-cc user_id
    routes:
      - "10.250.0.2/32"
    dial_policy: "auto"
  - name: "kiwi"
    user:
      node_id: 54064871525449607 # turntf-tun-kiwi node_id
      user_id: 1034 # turntf-tun-kiwi user_id
    routes:
      - "10.250.0.3/32"
    dial_policy: "auto"
  - name: "router"
    user:
      node_id: 54064626334500285 # turntf-tun-router-vlan node_id
      user_id: 1061 # turntf-tun-router-vlan user_id
    routes:
      - "10.250.0.4/32"
    dial_policy: "auto"
  - name: "pangolin"
    user:
      node_id: 54064626334500285 # turntf-tun-pangolin-vlan node_id
      user_id: 1062 # turntf-tun-pangolin-vlan user_id
    routes:
      - "10.250.0.5/32"
    dial_policy: "auto"
